<svg width="700" height="800" viewBox="0 0 700 800" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Architecture du pipeline SecureOps Shield</title>
<desc>Flux : code source vers CI/CD, vers image Docker durcie, vers DAST et Kubernetes en parallèle, vers EDR Wazuh, vers SOAR TheHive/Cortex, vers le dashboard consolidé.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6C8CFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="700" height="800" fill="#FFFFFF"/>

<!-- 1. Source / target app -->
<rect x="190" y="30" width="320" height="60" rx="10" fill="#F1F3F6" stroke="#64748B" stroke-width="1"/>
<text x="350" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">Application cible</text>
<text x="350" y="75" text-anchor="middle" font-size="12" fill="#475569">OWASP Juice Shop</text>

<line x1="350" y1="90" x2="350" y2="128" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- 2. CI/CD -->
<rect x="190" y="130" width="320" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="350" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#0C447C">CI/CD — SAST · Secrets · SCA</text>
<text x="350" y="175" text-anchor="middle" font-size="12" fill="#185FA5">Semgrep · Gitleaks · Trivy</text>

<line x1="350" y1="190" x2="350" y2="228" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- 3. Hardened image -->
<rect x="190" y="230" width="320" height="60" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="350" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#3C3489">Image Docker durcie</text>
<text x="350" y="275" text-anchor="middle" font-size="12" fill="#534AB7">Utilisateur non-root, image distroless</text>

<!-- split arrows -->
<path d="M350 290 L350 315 L210 315 L210 340" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M350 290 L350 315 L500 315 L500 340" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- 4a. DAST -->
<rect x="70" y="340" width="280" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="210" y="365" text-anchor="middle" font-size="15" font-weight="700" fill="#633806">DAST</text>
<text x="210" y="385" text-anchor="middle" font-size="12" fill="#854F0B">OWASP ZAP</text>

<!-- 4b. Kubernetes -->
<rect x="360" y="340" width="280" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="500" y="365" text-anchor="middle" font-size="15" font-weight="700" fill="#633806">Kubernetes</text>
<text x="500" y="385" text-anchor="middle" font-size="12" fill="#854F0B">kube-bench · Trivy k8s</text>

<!-- merge arrows -->
<path d="M210 400 L210 425 L350 425 L350 448" fill="none" stroke="#64748B" stroke-width="1.2"/>
<path d="M500 400 L500 425 L350 425 L350 448" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- 5. EDR -->
<rect x="190" y="450" width="320" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="350" y="475" text-anchor="middle" font-size="15" font-weight="700" fill="#085041">EDR — Wazuh</text>
<text x="350" y="495" text-anchor="middle" font-size="12" fill="#0F6E56">Détection temps réel (FIM, rootcheck)</text>

<line x1="350" y1="510" x2="350" y2="548" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- 6. SOAR -->
<rect x="190" y="550" width="320" height="60" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="350" y="575" text-anchor="middle" font-size="15" font-weight="700" fill="#712B13">SOAR — TheHive + Cortex</text>
<text x="350" y="595" text-anchor="middle" font-size="12" fill="#993C1D">Webhook automatisé, enrichissement</text>

<line x1="350" y1="610" x2="350" y2="648" stroke="#6C8CFF" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

<!-- 7. Dashboard (brand highlight) -->
<rect x="150" y="650" width="400" height="90" rx="12" fill="#0B0F17" stroke="#6C8CFF" stroke-width="1.5"/>
<text x="350" y="683" text-anchor="middle" font-size="16" font-weight="700" fill="#E8ECF1">SecureOps Shield — Dashboard</text>
<text x="350" y="705" text-anchor="middle" font-size="12" fill="#8B96A8">Score consolidé, chronologie live, export PDF</text>
<text x="350" y="723" text-anchor="middle" font-size="11" fill="#5EEAD4">Agrège les résultats de tous les blocs ci-dessus</text>

</svg>
